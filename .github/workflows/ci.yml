name: CI

on:
  pull_request:
  push:
    branches: [ "main", "feat/**" ]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-reviewed.sh needs history

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Mechanical review
        run: scripts/review.sh

      - name: Review record covers the code
        run: scripts/check-reviewed.sh HEAD
