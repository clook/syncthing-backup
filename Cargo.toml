[package]
name = "syncthing-backup"
version = "0.3.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
globset = { version = "0.4.20", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# panic stays "unwind": the worker catches a panic in the mover (spawn_blocking) and keeps running.
